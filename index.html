<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>仕入カウント確認アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-none">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-xl">📦</span>
      <h1 class="text-sm font-black tracking-wider">仕入カウント確認アプリ</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openPLListModal()" class="px-2.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold active:scale-95 flex items-center gap-1 shadow">
        <span>📂 取込PL一覧</span>
      </button>
      <button onclick="fetchMasterFromGas(false)" class="p-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white text-xs active:scale-95 shadow" title="商品マスタ更新">
        🔄マスタ
      </button>
      <button onclick="refreshPLDataFromGas(false)" class="p-1.5 rounded-xl bg-sky-700 hover:bg-sky-600 text-white text-xs active:scale-95 shadow" title="PLデータ取込">
        📥取込
      </button>
      <button onclick="openSettingsModal()" class="p-1.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700 active:scale-95" title="設定">
        ⚙️
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="flex-1 flex flex-col overflow-hidden relative">

    <!-- VIEW 1: PL入力画面（メイン） -->
    <div id="view-pl-entry" class="flex-1 flex flex-col justify-between p-4 pb-safe overflow-y-auto">
      <div class="space-y-3">
        <!-- 本日の進捗サマリー（横スクロール式） -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-bold text-slate-600">本日の進捗サマリー（横スクロール）</span>
            <button onclick="openPLListModal()" class="text-xs text-sky-600 font-bold hover:underline">全リスト表示 ➔</button>
          </div>
          <div id="pl-dashboard-scroll" class="flex gap-2.5 overflow-x-auto no-scrollbar py-1 px-0.5">
            <div class="text-center py-3 px-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200 shrink-0">PLデータ未取込（「📥取込」を押してください）</div>
          </div>
        </div>

        <!-- 商品検索カード（JAN手動入力部分を商品検索パネルに変更・AND検索対応） -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-slate-800 flex items-center gap-1.5">
              <span>🔍</span> 商品検索・追加（スペース区切りAND検索）
            </span>
            <span id="card-master-count" class="text-[11px] text-emerald-700 font-mono font-bold">マスタ未読込</span>
          </div>

          <div class="relative">
            <input type="text" id="manual-search-input" oninput="filterManualSearch(this.value)" placeholder="例: ROMBO ORG M （スペースでAND検索）" class="w-full px-3.5 py-2.5 border-2 border-slate-300 focus:border-sky-500 rounded-xl text-xs font-medium bg-slate-50 outline-none transition-all">
          </div>

          <!-- 検索候補リスト（最大15件表示・スクロール可能） -->
          <div id="manual-search-results" class="max-h-48 overflow-y-auto space-y-1.5 no-scrollbar border border-slate-100 rounded-xl p-1 bg-slate-50/50">
            <div class="text-center py-4 text-xs text-slate-400">商品名・カラー・サイズなどを入力して検索してください</div>
          </div>
        </div>
      </div>

      <!-- テンキー入力エリア -->
      <div class="my-auto py-4 max-w-sm mx-auto w-full">
        <div class="text-center mb-2">
          <span class="text-xs font-bold text-slate-600 uppercase tracking-widest block">
            検品するPL番号をテンキー入力
          </span>
          <div class="mt-1.5 h-16 bg-white border-2 border-slate-300 rounded-2xl flex items-center justify-center px-4 shadow-sm">
            <span id="pl-keypad-display" class="text-3xl font-black font-mono tracking-widest text-slate-400">
              PL番号を入力
            </span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="pressPlKeypad('1')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">1</button>
          <button onclick="pressPlKeypad('2')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">2</button>
          <button onclick="pressPlKeypad('3')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">3</button>
          <button onclick="pressPlKeypad('4')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">4</button>
          <button onclick="pressPlKeypad('5')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">5</button>
          <button onclick="pressPlKeypad('6')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">6</button>
          <button onclick="pressPlKeypad('7')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">7</button>
          <button onclick="pressPlKeypad('8')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">8</button>
          <button onclick="pressPlKeypad('9')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">9</button>
          <button onclick="clearPlKeypad()" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-2xl text-xs font-black text-rose-600 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">C</button>
          <button onclick="pressPlKeypad('0')" class="h-14 bg-white hover:bg-slate-100 active:bg-slate-200 rounded-2xl text-2xl font-black text-slate-800 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">0</button>
          <button onclick="backspacePlKeypad()" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-2xl text-sm font-bold text-slate-700 shadow-sm active:scale-95 transition-transform flex items-center justify-center border border-slate-300">⌫</button>
        </div>

        <button onclick="confirmPlKeypad()" class="w-full mt-3.5 h-14 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-black text-base rounded-2xl shadow-md flex items-center justify-center gap-2 transition-all">
          <span>PL番号を確定して検品開始</span>
          <span>➔</span>
        </button>
      </div>
    </div>

    <!-- VIEW 2: 検品画面 -->
    <div id="view-inspecting" class="flex-1 flex flex-col justify-between overflow-hidden hidden">
      <div class="px-4 py-2.5 bg-white border-b border-slate-200 flex items-center justify-between text-xs shadow-sm">
        <div>
          <span class="text-[11px] text-slate-500 block">対象PL</span>
          <span id="inspect-pl-label" class="font-mono font-black text-slate-900 text-base">PL -</span>
        </div>
        <button onclick="backToPlEntry()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700">PL選択に戻る</button>
      </div>

      <div id="inspection-cards-container" class="flex-1 overflow-y-auto p-3.5 space-y-3"></div>

      <div class="p-3.5 bg-white border-t border-slate-200 pb-safe shadow-lg">
        <button id="btn-goto-confirm" onclick="goToConfirmScreen()" disabled class="w-full py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 transition-all shadow-md bg-slate-200 text-slate-400 cursor-not-allowed">
          <span>送信前の最終確認プレビューへ</span>
          <span>➔</span>
        </button>
      </div>
    </div>

    <!-- VIEW 3: 最終確認プレビュー画面 -->
    <div id="view-confirm" class="flex-1 flex flex-col justify-between overflow-hidden hidden">
      <div class="p-3.5 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm">
        <div>
          <h3 class="text-sm font-bold text-slate-900">送信前 最終確認リスト</h3>
          <p id="confirm-pl-sub" class="text-xs text-slate-500">PL の検品結果</p>
        </div>
        <button onclick="backToInspectionScreen()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700">修正に戻る</button>
      </div>

      <div id="confirm-items-container" class="flex-1 overflow-y-auto p-3.5 space-y-2.5"></div>

      <div class="p-3.5 bg-white border-t border-slate-200 pb-safe space-y-2 shadow-lg">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-700 shrink-0">作業責任者:</label>
          <input type="text" id="inspector-name-input" value="伊尾" class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-slate-50">
        </div>
        <button onclick="submitInspectionData()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-2xl shadow-md active:scale-98 transition-all">
          検品結果をスプレッドシートに送信・保存 🚀
        </button>
      </div>
    </div>

  </main>

  <!-- 取込済みPLデータ一覧モーダル -->
  <div id="modal-pl-list" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm flex items-center gap-2"><span>📂</span> 取込済みPLデータ一覧</h3>
        <button onclick="closePLListModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
      </div>

      <!-- サマリーボックス -->
      <div class="px-4 py-2.5 bg-emerald-50 border-b border-emerald-200 text-xs flex items-center justify-around font-bold text-emerald-900">
        <div>予定総数: <span id="summary-total-plan" class="font-mono text-sm">0</span></div>
        <div>｜</div>
        <div>カウント総数(検品済): <span id="summary-total-actual" class="font-mono text-sm text-emerald-700 font-black">0</span></div>
      </div>

      <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 bg-slate-200 p-1 rounded-xl">
          <button id="filter-all-btn" onclick="setPLFilter('all')" class="px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition-all">すべて</button>
          <button id="filter-uncounted-btn" onclick="setPLFilter('uncounted')" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all">未検品のみ</button>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="refreshPLDataFromGas(true)" class="px-2.5 py-1.5 bg-sky-600 text-white text-xs font-bold rounded-xl shadow active:scale-95">⟳ 更新</button>
          <button onclick="purgeAllPLData()" class="px-2.5 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-xl shadow active:scale-95">🗑️ 全削除</button>
        </div>
      </div>
      <div id="pl-list-modal-body" class="p-4 overflow-y-auto flex-1 space-y-2.5"></div>
      <div class="p-3 bg-white border-t border-slate-200 flex justify-end">
        <button onclick="closePLListModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 差異理由3択モーダル -->
  <div id="modal-discrepancy" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
      <div class="p-4 bg-amber-600 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm">⚠️ 差異理由の選択</h3>
        <button onclick="closeDiscrepancyModal()" class="text-amber-200 hover:text-white text-lg font-bold px-2">✕</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">差異理由（3択）:</label>
          <select id="disc-reason-select" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white text-slate-800">
            <option value="過不足">過不足 (通常の超過・不足)</option>
            <option value="商品違い">商品違い (異なる商品の混入)</option>
            <option value="登録なし商品">登録なし商品 (自由入力)</option>
          </select>
        </div>
        <div id="disc-unregistered-container" class="hidden">
          <label class="text-xs font-bold text-slate-700 block mb-1">登録なし商品名・内容 (自由入力):</label>
          <input type="text" id="disc-unregistered-input" placeholder="例: 未登録の別カラー・商品など" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white text-slate-800">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">実数・カウント数量:</label>
          <input type="number" id="disc-qty-input" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono text-sm font-bold bg-white text-slate-800" value="0">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">備考メモ:</label>
          <input type="text" id="disc-note-input" placeholder="例: カートン破損あり など" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white text-slate-800">
        </div>
      </div>
      <div class="p-3 bg-white border-t border-slate-200 flex justify-end gap-2">
        <button onclick="closeDiscrepancyModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl">キャンセル</button>
        <button onclick="proceedFromDiscrepancy()" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl shadow">次へすすむ ➔</button>
      </div>
    </div>
  </div>

  <!-- 商品検索モーダル（商品違い用） -->
  <div id="modal-item-search" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-sm flex items-center gap-2"><span>🔍</span> 混入商品の検索（最大15件表示）</h3>
        <button onclick="closeItemSearchModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
      </div>
      <div class="p-3 bg-slate-50 border-b border-slate-200 space-y-2">
        <input type="text" id="search-keyword-input" oninput="filterMasterList(this.value)" placeholder="例: ROMBO ORG M （スペース区切りでAND検索）" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white font-medium">
      </div>
      <div id="item-search-results" class="p-3 overflow-y-auto flex-1 space-y-2"></div>
      <div class="p-3 bg-white border-t border-slate-200 flex justify-end">
        <button onclick="closeItemSearchModal()" class="px-4 py-2 bg-slate-200 text-slate-800 font-bold text-xs rounded-xl">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-black text-sm text-slate-900">⚙️ アプリ設定</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-700 block mb-1">GAS Web App URL:</label>
        <input type="text" id="settings-gas-url" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button onclick="saveSettings()" class="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl shadow">設定を保存</button>
    </div>
  </div>

  <!-- JavaScript制御ロジック -->
  <script>
    let state = {
      gasUrl: localStorage.getItem('gas_url') || '',
      currentView: 'view-pl-entry',
      plKeypadVal: '',
      activePlNo: null,
      plList: [],
      masterList: [],
      currentPlItems: [],
      inspectionResults: {},
      activeDiscIndex: null,
      tempDiscData: null,
      plFilterMode: 'all'
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('settings-gas-url').value = state.gasUrl;
      if (state.gasUrl) {
        fetchMasterFromGas(true);
      } else {
        openSettingsModal();
      }

      document.getElementById('disc-reason-select').addEventListener('change', function() {
        const val = this.value;
        const container = document.getElementById('disc-unregistered-container');
        if (val === '登録なし商品') {
          container.classList.remove('hidden');
        } else {
          container.classList.add('hidden');
        }
      });
    });

    function switchView(viewId) {
      ['view-pl-entry', 'view-inspecting', 'view-confirm'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      state.currentView = viewId;
    }

    function openSettingsModal() { document.getElementById('modal-settings').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('modal-settings').classList.add('hidden'); }
    function saveSettings() {
      state.gasUrl = document.getElementById('settings-gas-url').value.trim();
      localStorage.setItem('gas_url', state.gasUrl);
      closeSettingsModal();
      fetchMasterFromGas(true);
    }

    function openPLListModal() {
      document.getElementById('modal-pl-list').classList.remove('hidden');
      renderPLModalList();
    }
    function closePLListModal() { document.getElementById('modal-pl-list').classList.add('hidden'); }

    function setPLFilter(mode) {
      state.plFilterMode = mode;
      const btnAll = document.getElementById('filter-all-btn');
      const btnUncounted = document.getElementById('filter-uncounted-btn');
      if (mode === 'all') {
        btnAll.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition-all';
        btnUncounted.className = 'px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all';
      } else {
        btnUncounted.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition-all';
        btnAll.className = 'px-3 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all';
      }
      renderPLModalList();
    }

    async function fetchMasterFromGas(silent) {
      if (!state.gasUrl) return;
      try {
        const res = await fetch(`${state.gasUrl}?action=getMaster`);
        const json = await res.json();
        if (json.status === 'success') {
          state.masterList = json.data || [];
          document.getElementById('card-master-count').innerText = `商品マスタ ${state.masterList.length}件連携中`;
          if (!silent) alert(`商品マスタを更新しました（${state.masterList.length}件）`);
        }
      } catch (err) {
        if (!silent) alert('マスタ取得エラー: ' + err.message);
      }
    }

    async function refreshPLDataFromGas(silent) {
      if (!state.gasUrl) { alert('設定画面からGAS URLを入力してください'); openSettingsModal(); return; }
      try {
        const res = await fetch(`${state.gasUrl}?action=refreshPLData`);
        const json = await res.json();
        if (json.status === 'success') {
          state.plList = json.plList || json.data || [];
          renderPLDashboardScroll();
          if (!document.getElementById('modal-pl-list').classList.contains('hidden')) {
            renderPLModalList();
          }
          if (!silent) alert(`PLデータを反映しました（${state.plList.length}件）`);
        } else {
          if (!silent) alert('PLデータ取得失敗: ' + (json.message || '不明なエラー'));
        }
      } catch (err) {
        if (!silent) alert('PLデータ通信エラー: ' + err.message);
      }
    }

    async function purgeAllPLData() {
      if (!confirm('本当にすべての取込済みPLデータを削除しますか？\n（次の仕入用にデータをリセットします）')) return;
      try {
        const res = await fetch(`${state.gasUrl}?action=purgeAllPL`);
        const json = await res.json();
        if (json.status === 'success') {
          alert('すべてのPLデータを削除・リセットしました。');
          state.plList = [];
          renderPLDashboardScroll();
          closePLListModal();
        } else {
          alert('削除エラー: ' + (json.message || '不明なエラー'));
        }
      } catch (err) {
        alert('通信エラー: ' + err.message);
      }
    }

    function renderPLDashboardScroll() {
      const container = document.getElementById('pl-dashboard-scroll');
      if (!state.plList || state.plList.length === 0) {
        container.innerHTML = '<div class="text-center py-3 px-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200 shrink-0">PLデータ未取込（「📥取込」を押してください）</div>';
        return;
      }
      let html = '';
      state.plList.forEach(pl => {
        const badge = pl.isCompleted 
          ? '<span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded">検品済</span>'
          : '<span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded">未検品</span>';
        html += `
          <button onclick="selectPlNo('${pl.plNo}')" class="p-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl text-left shadow-sm transition-all active:scale-95 flex flex-col justify-between shrink-0 w-36">
            <div class="flex items-center justify-between w-full">
              <span class="font-mono font-black text-slate-900 text-sm">PL:${pl.plNo}</span>
              ${badge}
            </div>
            <div class="text-[11px] text-slate-500 mt-1.5">${pl.totalLines}品目 / ${pl.totalPlanQty}個</div>
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function renderPLModalList() {
      const body = document.getElementById('pl-list-modal-body');
      let targetList = state.plList || [];
      
      let sumPlan = 0;
      let sumActual = 0;
      targetList.forEach(pl => {
        sumPlan += Number(pl.totalPlanQty) || 0;
        if (pl.isCompleted && pl.actualTotalQty !== undefined) {
          sumActual += Number(pl.actualTotalQty) || 0;
        }
      });
      document.getElementById('summary-total-plan').innerText = sumPlan;
      document.getElementById('summary-total-actual').innerText = sumActual;

      if (state.plFilterMode === 'uncounted') {
        targetList = targetList.filter(pl => !pl.isCompleted);
      }

      if (targetList.length === 0) {
        body.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">該当するPLデータがありません</div>';
        return;
      }
      let html = '';
      targetList.forEach(pl => {
        const badge = pl.isCompleted ? '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-xs">検品済</span>' : '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold text-xs">未検品</span>';
        let detailText = `品目数: ${pl.totalLines}行 / 予定総数: ${pl.totalPlanQty}個`;
        if (pl.isCompleted && pl.actualTotalQty !== undefined) {
          detailText += ` <span class="text-emerald-700 font-bold">(実カウント: ${pl.actualTotalQty}個)</span>`;
        }
        html += `
          <div class="p-3.5 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-sm">
            <div>
              <div class="font-black text-base text-slate-900">PL番号: ${pl.plNo}</div>
              <div class="text-xs text-slate-500 mt-0.5">${detailText}</div>
            </div>
            <div class="flex items-center gap-2">
              ${badge}
              <button onclick="closePLListModal(); selectPlNo('${pl.plNo}');" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl active:scale-95">検品する</button>
            </div>
          </div>
        `;
      });
      body.innerHTML = html;
    }

    // メイン画面の商品検索（スペース区切りAND検索・最大15件表示）
    function filterManualSearch(keyword) {
      const container = document.getElementById('manual-search-results');
      const tokens = keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);

      if (tokens.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">商品名・カラー・サイズなどを入力して検索してください</div>';
        return;
      }

      const filtered = (state.masterList || []).filter(m => {
        const targetText = `${m.itemCode} ${m.jpDesign || ''} ${m.mexDesign || ''} ${m.jpColor || ''} ${m.mexColor || ''} ${m.jpSize || ''} ${m.mexSize || ''}`.toLowerCase();
        return tokens.every(token => targetText.includes(token));
      });

      const limitedList = filtered.slice(0, 15);

      if (limitedList.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">該当する商品が見つかりません</div>';
        return;
      }

      let html = '';
      limitedList.forEach(m => {
        const itemName = m.jpDesign || m.mexDesign || '商品名なし';
        const itemColor = m.jpColor || m.mexColor || '';
        const itemSize = m.jpSize || m.mexSize || '';

        html += `
          <div onclick="selectManualSearchItem('${m.itemCode}')" class="p-2.5 bg-white border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/30 rounded-xl shadow-sm cursor-pointer transition-all flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-mono text-[11px] font-bold text-slate-500">${m.itemCode}</span>
                <span class="px-1.5 py-0.5 bg-amber-100 text-amber-800 rounded text-[10px] font-bold">カラー: ${itemColor}</span>
                <span class="px-1.5 py-0.5 bg-rose-100 text-rose-800 rounded text-[10px] font-bold">サイズ: ${itemSize}</span>
              </div>
              <div class="font-black text-xs text-slate-900 mt-0.5">${itemName}</div>
            </div>
            <button class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg shrink-0 shadow-sm">確認 ＋</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function selectManualSearchItem(itemCode) {
      const item = state.masterList.find(m => m.itemCode === itemCode);
      if (!item) return;
      alert(`【商品検索結果】\n商品コード: ${item.itemCode}\n商品名: ${item.jpDesign || item.mexDesign}\nカラー: ${item.jpColor || item.mexColor}\nサイズ: ${item.jpSize || item.mexSize}`);
      document.getElementById('manual-search-input').value = '';
      document.getElementById('manual-search-results').innerHTML = '<div class="text-center py-4 text-xs text-slate-400">商品名・カラー・サイズなどを入力して検索してください</div>';
    }

    // テンキー
    function pressPlKeypad(n) {
      if (state.plKeypadVal.length >= 5) return;
      state.plKeypadVal += n;
      updateKeypadDisplay();
    }
    function clearPlKeypad() { state.plKeypadVal = ''; updateKeypadDisplay(); }
    function backspacePlKeypad() { state.plKeypadVal = state.plKeypadVal.slice(0, -1); updateKeypadDisplay(); }
    function updateKeypadDisplay() {
      const el = document.getElementById('pl-keypad-display');
      if (state.plKeypadVal === '') {
        el.innerText = 'PL番号を入力';
        el.className = 'text-3xl font-black font-mono tracking-widest text-slate-400';
      } else {
        el.innerText = state.plKeypadVal;
        el.className = 'text-3xl font-black font-mono tracking-widest text-emerald-700';
      }
    }
    function confirmPlKeypad() {
      if (!state.plKeypadVal) { alert('PL番号を入力してください'); return; }
      selectPlNo(state.plKeypadVal);
    }

    async function selectPlNo(plNo) {
      state.activePlNo = plNo;
      try {
        const res = await fetch(`${state.gasUrl}?action=getPLDetails&plNo=${plNo}`);
        const json = await res.json();
        if (json.status === 'success' && json.data.length > 0) {
          state.currentPlItems = json.data;
          state.inspectionResults = {};
          state.currentPlItems.forEach((item, idx) => {
            state.inspectionResults[idx] = { 
              actualQty: item.planQty,
              hasException: false, 
              discrepancies: [],
              tappedName: false,
              tappedColor: false,
              tappedSize: false,
              tappedPlan: false
            };
          });
          document.getElementById('inspect-pl-label').innerText = `PL - ${plNo}`;
          renderInspectionCards();
          switchView('view-inspecting');
        } else {
          alert(`PL番号「${plNo}」のデータが見つかりません。`);
        }
      } catch (err) {
        alert('通信エラー: ' + err.message);
      }
    }

    function backToPlEntry() { switchView('view-pl-entry'); }

    // 検品カード描画（カラー・サイズ特大表示 ＆ クイック増減ボタン付き）
    function renderInspectionCards() {
      const container = document.getElementById('inspection-cards-container');
      let html = '';
      state.currentPlItems.forEach((item, idx) => {
        const res = state.inspectionResults[idx];
        const isEx = res.hasException;
        const allTapped = res.tappedName && res.tappedColor && res.tappedSize && res.tappedPlan;

        let discSummary = (res.discrepancies || []).map(d => {
          let txt = `${d.reason}: ${d.qty}点`;
          if (d.targetItemCode) txt += ` [別商品: ${d.targetItemCode} ${d.targetItemName || ''}]`;
          if (d.unregName) txt += ` [登録なし: ${d.unregName}]`;
          return txt;
        }).join(' ／ ');

        let totalCount = res.actualQty;
        if (res.discrepancies.length > 0) {
          let extraSum = 0;
          res.discrepancies.forEach(d => { extraSum += Number(d.qty) || 0; });
          totalCount = Number(res.actualQty) + extraSum;
        }

        html += `
          <div class="bg-white border-2 ${isEx ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'} rounded-2xl p-4 shadow-sm space-y-3">
            <div class="text-xs font-bold text-slate-500 flex justify-between items-center">
              <span>品目 #${idx + 1} ｜ パレット:${item.palletNo || '-'} / カートン:${item.cartonNo || '-'}</span>
              <span class="font-mono text-slate-400 font-bold">${item.itemCode}</span>
            </div>
            
            <div class="space-y-2">
              <div onclick="tapField(${idx}, 'Name')" class="p-2.5 rounded-xl cursor-pointer transition-all border ${res.tappedName ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : 'bg-white border-slate-300 text-slate-800'}">
                <span class="block text-[10px] text-slate-400">商品名 (タップ確認)</span>
                <span class="text-sm font-black">${item.jpDesign || item.mexDesign}</span> ${res.tappedName ? '✓' : ''}
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div onclick="tapField(${idx}, 'Color')" class="p-2.5 rounded-xl cursor-pointer transition-all border ${res.tappedColor ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : 'bg-amber-50/60 border-amber-300 text-slate-900'}">
                  <span class="block text-[10px] text-amber-800 font-bold">🎨 カラー (タップ確認)</span>
                  <span class="text-base font-black tracking-wide">${item.jpColor || item.mexColor}</span> ${res.tappedColor ? '✓' : ''}
                </div>
                <div onclick="tapField(${idx}, 'Size')" class="p-2.5 rounded-xl cursor-pointer transition-all border ${res.tappedSize ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : 'bg-rose-50/80 border-rose-300 text-slate-900'}">
                  <span class="block text-[10px] text-rose-800 font-bold">📏 サイズ (タップ確認)</span>
                  <span class="text-xl font-black tracking-wider text-rose-700">${item.jpSize || item.mexSize}</span> ${res.tappedSize ? '✓' : ''}
                </div>
              </div>

              <div onclick="tapField(${idx}, 'Plan')" class="p-2.5 rounded-xl cursor-pointer transition-all border ${res.tappedPlan ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : 'bg-white border-slate-300 text-slate-700'}">
                <span class="block text-[10px] text-slate-400">PL予定数 (タップ確認)</span>
                <span class="font-mono text-sm font-black">${item.planQty}個</span> ${res.tappedPlan ? '✓' : ''}
              </div>
            </div>

            <div class="bg-emerald-50/60 p-3 rounded-2xl border border-emerald-200 space-y-2">
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-xs font-black text-slate-900 block">本来の商品のカウント実数:</span>
                  <span class="text-[10px] text-slate-500">予定(${item.planQty}個)に対する実際の数</span>
                </div>
                <div class="flex items-center gap-1">
                  <button ${!allTapped ? 'disabled' : ''} onclick="adjustQty(${idx}, -1)" class="w-10 h-10 bg-white border border-emerald-400 rounded-xl font-black text-lg text-emerald-800 active:scale-95 shadow-sm flex items-center justify-center">-</button>
                  <button ${!allTapped ? 'disabled' : ''} onclick="adjustQty(${idx}, 1)" class="w-10 h-10 bg-emerald-600 rounded-xl font-black text-lg text-white active:scale-95 shadow-sm flex items-center justify-center">+</button>
                </div>
              </div>
              <input type="number" ${!allTapped ? 'disabled' : ''} value="${res.actualQty}" onchange="updateActualQty(${idx}, this.value)" class="w-full px-3 py-2.5 border-2 border-emerald-500 rounded-xl font-mono text-xl font-black bg-white text-emerald-950 text-center shadow-sm">
            </div>

            <div class="flex items-center gap-2 pt-1">
              <button ${!allTapped ? 'disabled' : ''} onclick="setInspectionMatch(${idx})" class="flex-1 py-3 rounded-xl text-xs font-bold transition-all ${!allTapped ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : (!isEx ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-700')}">
                ✓ 予定通り一致 (${item.planQty})
              </button>
              <button ${!allTapped ? 'disabled' : ''} onclick="openDiscrepancyModal(${idx})" class="px-4 py-3 rounded-xl text-xs font-bold transition-all ${!allTapped ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : (isEx ? 'bg-amber-600 text-white shadow' : 'bg-amber-50 text-amber-800 border border-amber-300')}">
                ⚠️ 差異あり ${res.discrepancies.length > 0 ? '('+res.discrepancies.length+')' : ''}
              </button>
            </div>
            ${!allTapped ? '<div class="text-[10px] text-rose-600 font-bold text-center">↑ 上記の4項目すべてをタップして確認してください</div>' : ''}

            ${isEx ? `
              <div class="p-3 bg-amber-50 border border-amber-300 rounded-xl text-xs space-y-1.5">
                <div class="font-bold text-amber-900">📊 カウント計算結果・内訳:</div>
                <div class="text-amber-800 font-mono">${discSummary || '詳細未登録'}</div>
                <div class="pt-1.5 border-t border-amber-200 font-black text-amber-950 flex justify-between items-center">
                  <span>本来の商品実数(${res.actualQty}個) ＋ 追加・別商品カウント ＝</span>
                  <span class="text-sm font-mono text-emerald-700 font-black">合計 ${totalCount}点</span>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
      checkInspectionCompletion();
    }

    function tapField(idx, field) {
      if (field === 'Name') state.inspectionResults[idx].tappedName = true;
      if (field === 'Color') state.inspectionResults[idx].tappedColor = true;
      if (field === 'Size') state.inspectionResults[idx].tappedSize = true;
      if (field === 'Plan') state.inspectionResults[idx].tappedPlan = true;
      renderInspectionCards();
    }

    function updateActualQty(idx, val) {
      state.inspectionResults[idx].actualQty = Number(val) || 0;
      renderInspectionCards();
    }

    function adjustQty(idx, delta) {
      let current = Number(state.inspectionResults[idx].actualQty) || 0;
      current += delta;
      if (current < 0) current = 0;
      state.inspectionResults[idx].actualQty = current;
      renderInspectionCards();
    }

    function setInspectionMatch(idx) {
      state.inspectionResults[idx].actualQty = state.currentPlItems[idx].planQty;
      state.inspectionResults[idx].hasException = false;
      state.inspectionResults[idx].discrepancies = [];
      renderInspectionCards();
    }

    function openDiscrepancyModal(idx) {
      state.activeDiscIndex = idx;
      document.getElementById('disc-qty-input').value = '1';
      document.getElementById('disc-note-input').value = '';
      document.getElementById('disc-unregistered-input').value = '';
      document.getElementById('disc-reason-select').value = '過不足';
      document.getElementById('disc-unregistered-container').classList.add('hidden');
      document.getElementById('modal-discrepancy').classList.remove('hidden');
    }

    function closeDiscrepancyModal() {
      document.getElementById('modal-discrepancy').classList.add('hidden');
    }

    function proceedFromDiscrepancy() {
      const reason = document.getElementById('disc-reason-select').value;
      const qty = Number(document.getElementById('disc-qty-input').value) || 0;
      const note = document.getElementById('disc-note-input').value.trim();
      const unregName = document.getElementById('disc-unregistered-input').value.trim();

      state.tempDiscData = {
        reason: reason,
        qty: qty,
        note: note,
        targetItemCode: '',
        targetItemName: '',
        targetSize: '',
        unregName: unregName
      };

      closeDiscrepancyModal();

      if (reason === '商品違い') {
        openItemSearchModal();
      } else {
        saveCurrentDiscrepancy();
      }
    }

    function openItemSearchModal() {
      document.getElementById('search-keyword-input').value = '';
      renderMasterSearchResults(state.masterList.slice(0, 15));
      document.getElementById('modal-item-search').classList.remove('hidden');
    }

    function closeItemSearchModal() {
      document.getElementById('modal-item-search').classList.add('hidden');
    }

    function filterMasterList(keyword) {
      const tokens = keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
      if (tokens.length === 0) {
        renderMasterSearchResults(state.masterList.slice(0, 15));
        return;
      }
      const filtered = state.masterList.filter(m => {
        const textTarget = `${m.itemCode} ${m.jpDesign} ${m.mexDesign} ${m.jpColor} ${m.mexColor} ${m.jpSize} ${m.mexSize}`.toLowerCase();
        return tokens.every(token => textTarget.includes(token));
      });
      renderMasterSearchResults(filtered.slice(0, 15));
    }

    function renderMasterSearchResults(list) {
      const container = document.getElementById('item-search-results');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">該当する商品が見つかりません</div>';
        return;
      }
      let html = '';
      list.forEach(m => {
        html += `
          <div onclick="selectMixedItem('${m.itemCode}', '${m.jpDesign || m.mexDesign}', '${m.jpSize || m.mexSize}')" class="p-3 bg-white border border-slate-200 hover:border-emerald-500 rounded-2xl shadow-sm cursor-pointer transition-all active:scale-[0.99] flex items-center justify-between">
            <div>
              <span class="font-mono text-xs font-bold text-slate-500">${m.itemCode}</span>
              <div class="font-black text-sm text-slate-900">${m.jpDesign || m.mexDesign}</div>
              <div class="text-xs text-slate-600">カラー: <strong class="text-slate-900">${m.jpColor || m.mexColor}</strong> ｜ サイズ: <strong class="text-slate-900">${m.jpSize || m.mexSize}</strong></div>
            </div>
            <button class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow">選択 ➔</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function selectMixedItem(code, name, size) {
      if (!state.tempDiscData) state.tempDiscData = {};
      state.tempDiscData.targetItemCode = code;
      state.tempDiscData.targetItemName = name;
      state.tempDiscData.targetSize = size;

      closeItemSearchModal();
      saveCurrentDiscrepancy();
    }

    function saveCurrentDiscrepancy() {
      const idx = state.activeDiscIndex;
      if (idx === null || !state.tempDiscData) return;

      state.inspectionResults[idx].hasException = true;
      state.inspectionResults[idx].discrepancies.push(state.tempDiscData);

      state.activeDiscIndex = null;
      state.tempDiscData = null;
      renderInspectionCards();
    }

    function checkInspectionCompletion() {
      const btn = document.getElementById('btn-goto-confirm');
      btn.disabled = false;
      btn.className = 'w-full py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 transition-all shadow-md bg-emerald-600 hover:bg-emerald-500 text-white active:scale-[0.98]';
    }

    function goToConfirmScreen() {
      document.getElementById('confirm-pl-sub').innerText = `PL - ${state.activePlNo} の検品結果`;
      const container = document.getElementById('confirm-items-container');
      let html = '';
      state.currentPlItems.forEach((item, idx) => {
        const res = state.inspectionResults[idx];
        let discHtml = '';
        let extraSum = 0;
        if (res.hasException && res.discrepancies.length > 0) {
          res.discentancies?.forEach(d => {
            extraSum += Number(d.qty) || 0;
            discHtml += `<div class="text-amber-700 font-bold mt-1">⚠️ ${d.reason}: ${d.qty}点</div>`;
          });
        }
        const totalFinal = Number(res.actualQty) + extraSum;

        html += `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm space-y-1 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-mono text-slate-500">${item.itemCode || 'コードなし'}</span>
              <span class="font-bold ${res.hasException ? 'text-amber-600' : 'text-emerald-600'}">${res.hasException ? '⚠️ 差異あり' : '✓ 一致'}</span>
            </div>
            <div class="font-black text-slate-900 text-sm">${item.jpDesign || item.mexDesign}</div>
            <div class="text-slate-600">カラー: <strong class="text-slate-900">${item.jpColor || item.mexColor}</strong> ｜ サイズ: <strong class="text-slate-900">${item.jpSize || item.mexSize}</strong></div>
            ${discHtml}
            <div class="flex justify-between font-mono pt-1 border-t border-slate-100 mt-1">
              <span>PL予定: ${item.planQty} / 実数入力: ${res.actualQty}</span>
              <span class="font-bold text-emerald-700">合計点数: ${totalFinal}点</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
      switchView('view-confirm');
    }

    function backToInspectionScreen() { switchView('view-inspecting'); }

    async function submitInspectionData() {
      const targetPl = state.plList.find(p => String(p.plNo) === String(state.activePlNo));
      const isAlreadyCompleted = targetPl && targetPl.isCompleted;

      if (isAlreadyCompleted) {
        const firstWarn = confirm(`⚠️ 【警告 1/2】\nPL番号「${state.activePlNo}」は本日はすでにカウント入力済み（検品済）です。\n\n再度上書き送信しますが、本当に間違いありませんか？`);
        if (!firstWarn) return;

        const secondWarn = confirm(`🚨 【警告 2/2・最終確認】\n本当に上書きしてよろしいですか？\nこの操作により既存のカウントデータが更新されます。`);
        if (!secondWarn) return;
      }

      const inspectorName = document.getElementById('inspector-name-input').value.trim() || '未記入';
      const payload = {
        action: 'submitInspection',
        plNo: state.activePlNo,
        inspectorName: inspectorName,
        items: state.currentPlItems.map((item, idx) => {
          const res = state.inspectionResults[idx];
          return {
            itemCode: item.itemCode,
            mexDesign: item.mexDesign,
            mexColor: item.mexColor,
            mexSize: item.mexSize,
            jpDesign: item.jpDesign,
            jpColor: item.jpColor,
            jpSize: item.jpSize,
            planQty: item.planQty,
            actualQty: Number(res.actualQty),
            hasException: res.hasException,
            discrepancies: res.discrepancies
          };
        })
      };

      try {
        const res = await fetch(state.gasUrl, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'success') {
          alert('検品データを保存し、差異確認シートを更新しました！');
          switchView('view-pl-entry');
          refreshPLDataFromGas(true);
        } else {
          alert('保存エラー: ' + json.message);
        }
      } catch (err) {
        alert('送信エラー: ' + err.message);
      }
    }
  </script>
</body>
</html>
